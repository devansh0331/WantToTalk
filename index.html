<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Want to talk?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
    }
    p {
      font-size: 1.2rem;
      margin: 0 0 20px;
      opacity: 0.9;
    }
    #status {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 15px;
    }
    a {
      display: inline-block;
      background: white;
      color: #333;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    a:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Want to talk?</h1>
    <p>Mi attach upalabdh aahe – krupaya thoda vel thamba.</p>
    <br>
    <p>Tumhi link var click kartach majha phone vajla.</p>
    <p id="status"></p> <!-- confirmation message appears here -->
  </div>

  <script>
    // Replace with YOUR ntfy topic name
    const topic = "qwerty2026-emergency";

    // Wait for page to fully load, then send the notification
    document.addEventListener("DOMContentLoaded", function() {
      // Add cache-buster to ensure the request is never cached
      const url = `https://ntfy.sh/${topic}?cache=${Date.now()}`;

      fetch(url, {
        method: "POST",
        body: "Someone opened your 'Want to talk?' link!",
      })
      .then(() => {
        document.getElementById("status").innerText = "✅ I've been notified!";
      })
      .catch(err => {
        console.error("Notification failed", err);
        document.getElementById("status").innerText = "⚠️ Something went wrong.";
      });
    });
  </script>
</body>
</html>
